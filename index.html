<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 作业学习库 — homework-share 文件管理器</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#1e2230; --muted:#6b7280;
    --line:#e7e9f2; --brand:#6366f1; --brand-2:#8b5cf6; --brand-soft:#eef0ff;
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --due:#fde68a;
    --shadow:0 8px 28px -10px rgba(40,42,80,.18),0 2px 6px -2px rgba(40,42,80,.08);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%,rgba(139,92,246,.10),transparent 60%),
      radial-gradient(1000px 500px at -10% 0%,rgba(99,102,241,.10),transparent 55%),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:24px 22px 60px}

  /* Header */
  header.top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:18px 20px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  header.top::before{
    content:"";position:absolute;inset:0 auto 0 0;width:6px;
    background:linear-gradient(180deg,var(--brand),var(--brand-2));
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:20px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 14px -4px rgba(99,102,241,.6);
  }
  .brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:-2px;letter-spacing:0}
  .spacer{flex:1}
  .file-status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--brand-soft);padding:7px 12px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd1e0}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
  .dot.mod{background:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.15)}

  /* Buttons */
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:transform .12s ease,box-shadow .12s ease,background .12s;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 14px -6px rgba(99,102,241,.65)}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--brand-soft);border-color:#d4d6f5}
  .btn.soft{background:var(--brand-soft);color:var(--brand);box-shadow:none}
  .btn.danger{background:linear-gradient(135deg,#ef4444,#f97316);box-shadow:0 6px 14px -6px rgba(239,68,68,.6)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat .k{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  .stat .v{font-size:26px;font-weight:800;margin-top:4px;line-height:1}
  .stat .ic{position:absolute;right:-6px;top:-6px;font-size:42px;opacity:.08}
  .stat.due .v{color:var(--warn)}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;margin:18px 0 16px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:13.5px;background:var(--panel);box-shadow:var(--shadow);outline:none;transition:border .12s,box-shadow .12s}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
  .search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  select,input[type=text],input[type=url],input[type=datetime-local],textarea{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:13.5px;background:#fff;outline:none;transition:border .12s,box-shadow .12s}
  select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
  .select-wrap{position:relative}
  .select-wrap::after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
  .select-wrap select{appearance:none;padding-right:34px}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .14s,box-shadow .14s,border .14s;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:0 14px 32px -12px rgba(40,42,80,.22);border-color:#dcdff7}
  .card .ttl{font-weight:700;font-size:15.5px;line-height:1.35;padding-right:60px}
  .card .id{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;background:var(--brand-soft);color:var(--brand);padding:2px 7px;border-radius:6px;display:inline-block;width:fit-content}
  .card .url{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--brand);text-decoration:none;word-break:break-all;border:1px dashed #d4d6f5;background:#fafbff;padding:8px 10px;border-radius:9px}
  .card .url:hover{background:var(--brand-soft);border-style:solid}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
  .badge{padding:3px 9px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .badge.subject{background:#eef0ff;color:#5b5ef0}
  .badge.tag{background:#f1f3f9;color:#4b5366}
  .badge.due{background:var(--due);color:#92500a}
  .badge.due.over{background:#fee2e2;color:#b91c1c}
  .card .desc{font-size:13px;color:#475569;line-height:1.5;background:#fafbff;border-radius:9px;padding:9px 11px;border:1px solid var(--line)}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
  .card .time{font-size:11.5px;color:var(--muted)}
  .card .actions{display:flex;gap:6px}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--radius)}
  .empty .big{font-size:46px;margin-bottom:8px;opacity:.5}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(20,22,40,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--panel);border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(20,22,40,.5);animation:pop .2s ease}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h3{margin:0;padding:18px 22px 14px;font-size:17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .modal .body{padding:18px 22px;display:grid;gap:13px}
  .modal .row{display:grid;gap:5px}
  .modal .row label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
  .modal .row.req label::after{content:" *";color:var(--danger)}
  .modal .two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .modal .foot{padding:14px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);background:#fbfcff;border-radius:0 0 18px 18px}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .25s;z-index:80;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:linear-gradient(135deg,var(--ok),#059669)}
  .toast.err{background:linear-gradient(135deg,var(--danger),#dc2626)}

  /* hint banner */
  .hint{background:linear-gradient(135deg,#eef0ff,#f5f0ff);border:1px solid #dcdff7;border-radius:12px;padding:12px 16px;font-size:12.5px;color:#4b5ef0;display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .hint .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
  .hint .x:hover{background:rgba(0,0,0,.06);color:var(--ink)}

  @media(max-width:780px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .modal .two{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">📚</div>
      <div>作业学习库
        <small>homework-share 文件管理器 · 与 MCP server.py 共用 data.json</small>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="file-status" id="fileStatus">
      <span class="dot" id="fileDot"></span>
      <span id="fileLabel">未连接文件</span>
    </div>
    <button class="btn ghost sm" id="btnOpen" title="打开 data.json">📂 打开</button>
    <button class="btn ghost sm" id="btnSave" disabled title="保存到 data.json">💾 保存</button>
    <button class="btn sm" id="btnAdd">➕ 新建作业</button>
  </header>

  <div class="hint" id="hint">
    💡 提示：点「打开」选择 MCP 目录下的 <code>data.json</code> 即可同步本地作业；改动后点「保存」回写。首次使用若无 data.json，可直接「新建作业」，系统会自动生成。
    <span class="x" id="hintClose">✕</span>
  </div>

  <div class="hint shared" id="sharedBanner" style="display:none;background:linear-gradient(135deg,#dcfce7,#d1fae5);border-color:#a7f3d0;color:#065f46">
    <span>📋 你正在查看一份<span style="font-weight:700">分享的作业快照</span>（共 <b id="sharedCount">0</b> 条，只读）。点「导入到我的库」即可转为可编辑副本。</span>
    <span style="display:flex;gap:8px;margin-left:auto">
      <button class="btn soft sm" id="btnImport">📥 导入到我的库</button>
    </span>
  </div>

  <section class="stats" id="stats">
    <div class="stat"><div class="ic">📚</div><div class="k">作业总数</div><div class="v" id="sTotal">0</div></div>
    <div class="stat"><div class="ic">📘</div><div class="k">科目数</div><div class="v" id="sSubject">0</div></div>
    <div class="stat"><div class="ic">🏷</div><div class="k">标签数</div><div class="v" id="sTags">0</div></div>
    <div class="stat due"><div class="ic">⏰</div><div class="k">即将截止</div><div class="v" id="sDue">0</div></div>
  </section>

  <div class="toolbar">
    <div class="search"><input id="search" type="text" placeholder="搜索 标题 / 描述 / URL…"></div>
    <div class="select-wrap"><select id="fSubject"><option value="">全部科目</option></select></div>
    <div class="select-wrap"><select id="fTag"><option value="">全部标签</option></select></div>
    <div class="select-wrap"><select id="fSort">
      <option value="created_desc">最近创建</option>
      <option value="created_asc">最早创建</option>
      <option value="due_asc">截止时间 ↑</option>
      <option value="title_asc">标题 A→Z</option>
    </select></div>
    <button class="btn ghost sm" id="btnExport">⬇ 导出 Markdown</button>
    <button class="btn sm" id="btnShare" title="把当前作业编码进链接，发给同学即可看到同样的内容">🔗 生成分享链接</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">➕ 新建作业</h3>
    <div class="body">
      <div class="row req"><label>作业标题</label><input id="f_title" type="text" placeholder="例：第三单元 数学练习"></div>
      <div class="row req"><label>链接 URL</label><input id="f_url" type="url" placeholder="https://…"></div>
      <div class="two">
        <div class="row"><label>科目</label><input id="f_subject" type="text" placeholder="数学 / 语文 …"></div>
        <div class="row"><label>截止时间</label><input id="f_due" type="datetime-local"></div>
      </div>
      <div class="row"><label>标签（逗号分隔）</label><input id="f_tags" type="text" placeholder="期中考试, 第三单元"></div>
      <div class="row"><label>说明</label><textarea id="f_desc" rows="3" placeholder="作业要求、备注…"></textarea>
    </div>
    <div class="foot">
      <button class="btn ghost sm" id="btnCancel">取消</button>
      <button class="btn sm" id="btnSaveHw">💾 保存作业</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 状态 ============ */
let DB = { homeworks: [] };
let fileHandle = null;          // File System Access API 句柄
let dirty = false;             // 是否有未保存改动
let editingId = null;          // 当前编辑的作业 id(null=新增)

const $ = (id) => document.getElementById(id);
const LS_KEY = 'hw-mcp:data.json';   // 离线兜底

/* ============ 工具函数 ============ */
const newId = () => {
  const hex = '0123456789abcdef';
  let s = ''; for (let i=0;i<10;i++) s += hex[Math.floor(Math.random()*16)];
  return s;
};
const nowStr = () => {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};
const esc = (s='') => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type=''){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.className='toast',2000);
}

function parseTags(s=''){
  return String(s).split(',').map(t=>t.trim()).filter(Boolean);
}

/* ============ File System Access API ============ */
const FSA = window.showOpenFilePicker !== undefined;

async function openFile(){
  // 若不支持 FSA，走隐藏 input
  if (!FSA){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try{
        const text = await f.text();
        loadJSON(text, f.name);
      }catch(e){ toast('读取失败：'+e.message,'err'); }
    };
    inp.click();
    return;
  }
  try{
    const [h] = await window.showOpenFilePicker({
      types:[{description:'JSON',accept:{'application/json':['.json']}}],
      excludeAcceptAllOption:false,
      multiple:false,
      id:'datajson', startIn:'desktop',
    });
    fileHandle = h;
    const f = await h.getFile();
    const text = await f.text();
    loadJSON(text, f.name);
  }catch(e){
    if (e.name !== 'AbortError') toast('打开失败：'+e.message,'err');
  }
}

function loadJSON(text, name='data.json'){
  try{
    const obj = JSON.parse(text);
    DB = { homeworks: Array.isArray(obj.homeworks)? obj.homeworks : [] };
    setFileStatus(name, true, false);
    dirty = false;
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    render();
    toast(`✅ 已加载 ${DB.homeworks.length} 条作业（${name}）`,'ok');
  }catch(e){
    toast('JSON 解析失败：'+e.message,'err');
  }
}

async function saveFile(){
  if (fileHandle && FSA){
    try{
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(DB,null,2));
      await w.close();
      dirty = false; setFileStatus(fileHandle.name||'data.json', true, false);
      toast('💾 已保存到文件','ok');
    }catch(e){
      // 可能因权限丢失需要重新授权
      if (e.name==='NotAllowedError' || e.name==='SecurityError'){
        try{ await fileHandle.requestPermission({mode:'readwrite'}); await saveFile(); }
        catch(e2){ fallbackDownload(); }
      } else { toast('保存失败：'+e.message,'err'); }
    }
    return;
  }
  fallbackDownload();
}

function fallbackDownload(){
  // FSA 不可用：下载文件 + 写 localStorage
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  dirty = false;
  setFileStatus('data.json (已下载)', false, false);
  toast('💾 已下载 data.json，请放回 hw-mcp 目录','ok');
}

function setFileStatus(label, connected, modified){
  $('fileLabel').textContent = label;
  const dot = $('fileDot');
  dot.className = 'dot' + (connected?' on':'') + (modified?' mod':'');
  $('btnSave').disabled = !connected && !modified ? true : (connected && !modified ? true : modified);
  // 简化：只要 dirty 或未连接都可保存
  $('btnSave').disabled = false;
}

/* ============ CRUD ============ */
function openModal(id=null){
  editingId = id;
  const hw = id ? DB.homeworks.find(h=>h.id===id) : null;
  $('modalTitle').innerHTML = id ? '✏️ 编辑作业' : '➕ 新建作业';
  $('f_title').value = hw?.title || '';
  $('f_url').value = hw?.url || '';
  $('f_subject').value = hw?.subject || '';
  $('f_desc').value = hw?.description || '';
  $('f_tags').value = (hw?.tags||[]).join(', ');
  // due_date 格式转 datetime-local: "2026-10-20 23:59" -> "2026-10-20T23:59"
  let due = hw?.due_date || '';
  due = due.replace(' ','T');
  $('f_due').value = due;
  $('overlay').classList.add('show');
  setTimeout(()=>$('f_title').focus(),50);
}
function closeModal(){ $('overlay').classList.remove('show'); }

function saveHomework(){
  const title = $('f_title').value.trim();
  const url = $('f_url').value.trim();
  if(!title){ toast('请填写标题','err'); $('f_title').focus(); return; }
  if(!url){ toast('请填写链接 URL','err'); $('f_url').focus(); return; }

  const payload = {
    title, url,
    subject: $('f_subject').value.trim(),
    description: $('f_desc').value.trim(),
    due_date: $('f_due').value.replace('T',' '),
    tags: parseTags($('f_tags').value),
  };

  if (editingId){
    const hw = DB.homeworks.find(h=>h.id===editingId);
    Object.assign(hw, payload);
    toast('✅ 已更新「'+title+'」','ok');
  } else {
    DB.homeworks.push({
      id:newId(),
      ...payload,
      created_at: nowStr(),
    });
    toast('✅ 已新增「'+title+'」','ok');
  }
  markDirty();
  closeModal();
  render();
}

function deleteHomework(id){
  const hw = DB.homeworks.find(h=>h.id===id);
  if(!hw) return;
  if(!confirm(`确定删除「${hw.title}」吗？此操作不可撤销。`)) return;
  DB.homeworks = DB.homeworks.filter(h=>h.id!==id);
  markDirty();
  render();
  toast('🗑 已删除','ok');
}

function markDirty(){
  dirty = true;
  const lbl = fileHandle ? (fileHandle.name||'data.json') : '未连接文件';
  setFileStatus(lbl + '（未保存）', !!fileHandle, true);
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
}

/* ============ 渲染 ============ */
function getFiltered(){
  let items = DB.homeworks.slice();
  const kw = $('search').value.trim().toLowerCase();
  const subj = $('fSubject').value;
  const tag = $('fTag').value;
  if(kw){
    items = items.filter(h =>
      [h.title,h.subject,h.description,h.url,(h.tags||[]).join(' ')]
      .join(' ').toLowerCase().includes(kw));
  }
  if(subj) items = items.filter(h => (h.subject||'')===subj);
  if(tag) items = items.filter(h => (h.tags||[]).includes(tag));

  const sort = $('fSort').value;
  const byDue = (a,b)=> (a.due_date||'9999').localeCompare(b.due_date||'9999');
  switch(sort){
    case 'created_asc': items.sort((a,b)=>a.created_at.localeCompare(b.created_at)); break;
    case 'due_asc': items.sort(byDue); break;
    case 'title_asc': items.sort((a,b)=>a.title.localeCompare(b.title,'zh')); break;
    default: items.sort((a,b)=>b.created_at.localeCompare(a.created_at));
  }
  return items;
}

function updateFilters(){
  const subjects = [...new Set(DB.homeworks.map(h=>h.subject).filter(Boolean))];
  const tags = [...new Set(DB.homeworks.flatMap(h=>h.tags||[]))];
  const fs = $('fSubject'), ft = $('fTag');
  const curS = fs.value, curT = ft.value;
  fs.innerHTML = '<option value="">全部科目</option>' + subjects.map(s=>`<option ${s===curS?'selected':''}>${esc(s)}</option>`).join('');
  ft.innerHTML = '<option value="">全部标签</option>' + tags.map(t=>`<option ${t===curT?'selected':''}>${esc(t)}</option>`).join('');
}

function updateStats(){
  const all = DB.homeworks;
  const subjects = new Set(all.map(h=>h.subject).filter(Boolean));
  const tags = new Set(all.flatMap(h=>h.tags||[]));
  const now = new Date();
  const soon = all.filter(h=>{
    if(!h.due_date) return false;
    const d = new Date(h.due_date.replace(' ','T'));
    const diff = (d - now) / 86400000;
    return diff >= -1 && diff <= 3;  // 3 天内或已过期1天内
  }).length;
  $('sTotal').textContent = all.length;
  $('sSubject').textContent = subjects.size;
  $('sTags').textContent = tags.size;
  $('sDue').textContent = soon;
}

function render(){
  updateStats();
  updateFilters();
  const items = getFiltered();
  const grid = $('grid');
  if (items.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="big">${DB.homeworks.length===0?'📭':'🔍'}</div>
      <div>${DB.homeworks.length===0?'还没有作业记录<br>点右上「新建作业」开始添加':'没有匹配的作业'}</div>
    </div>`;
    return;
  }
  const now = new Date();
  grid.innerHTML = items.map(h=>{
    const due = h.due_date ? new Date(h.due_date.replace(' ','T')) : null;
    let dueBadge = '';
    if(due){
      const diff = (due - now)/86400000;
      const over = diff < 0;
      const lbl = over ? `⏰ 已过期 ${Math.abs(Math.round(diff))}天` : `⏰ ${h.due_date}`;
      dueBadge = `<span class="badge due ${over?'over':''}">${esc(lbl)}</span>`;
    }
    const subj = h.subject ? `<span class="badge subject">📘 ${esc(h.subject)}</span>` : '';
    const tags = (h.tags||[]).map(t=>`<span class="badge tag">🏷 ${esc(t)}</span>`).join('');
    const desc = h.description ? `<div class="desc">${esc(h.description)}</div>` : '';
    return `<div class="card">
      <span class="id">${esc(h.id)}</span>
      <div class="ttl">${esc(h.title)}</div>
      <a class="url" href="${esc(h.url)}" target="_blank" rel="noopener">🔗 ${esc(h.url)}</a>
      <div class="meta">${subj}${dueBadge}${tags}</div>
      ${desc}
      <div class="foot">
        <span class="time">🕒 ${esc(h.created_at||'')}</span>
        ${sharedMode ? '' : `<div class="actions">
          <button class="btn ghost sm" onclick="openModal('${h.id}')">✏️</button>
          <button class="btn ghost sm" onclick="deleteHomework('${h.id}')" style="color:var(--danger)">🗑</button>
        </div>`}
      </div>
    </div>`;
  }).join('');
}

/* ============ Markdown 导出 ============ */
function exportMarkdown(){
  const items = DB.homeworks;
  if(!items.length){ toast('没有作业可导出','err'); return; }
  const lines = [`# 作业列表（共 ${items.length} 条）`,''];
  items.forEach(h=>{
    lines.push(`## ${h.title}`);
    lines.push(`- ID: \`${h.id}\``);
    lines.push(`- 链接: ${h.url}`);
    if(h.subject) lines.push(`- 科目: ${h.subject}`);
    if(h.due_date) lines.push(`- 截止: ${h.due_date}`);
    if(h.tags?.length) lines.push(`- 标签: ${h.tags.join(', ')}`);
    if(h.description) lines.push(`- 说明: ${h.description}`);
    lines.push('');
  });
  const blob = new Blob([lines.join('\n')], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `homeworks-${nowStr().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇ 已导出 Markdown','ok');
}

/* ============ 分享链接（URL hash 携带数据，无需后端） ============ */
let sharedMode = false;   // 是否处于「分享快照只读」模式

// UTF-8 安全的 base64 url 编码（使用 base64url，避免 URL 转义问题）
function b64urlEncode(s){
  const bytes = new TextEncoder().encode(s);
  let bin=''; for(const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// 把当前 DB 编码进 URL hash，返回完整分享链接
function buildShareLink(){
  const payload = JSON.stringify({v:1, homeworks:DB.homeworks});
  const enc = b64urlEncode(payload);
  return location.origin + location.pathname + location.search + '#data=' + enc;
}

// 从 location.hash 读取分享数据；成功返回 true 并写入 DB / 进入 sharedMode
function loadFromHash(){
  const m = location.hash.match(/[#&]data=([^&]+)/);
  if(!m) return false;
  try{
    const obj = JSON.parse(b64urlDecode(m[1]));
    if(obj && Array.isArray(obj.homeworks)){
      DB = { homeworks: obj.homeworks };
      sharedMode = true;
      return true;
    }
  }catch(e){ console.warn('分享数据解析失败：', e); }
  return false;
}

function enterSharedMode(){
  $('sharedBanner').style.display = 'flex';
  $('sharedCount').textContent = DB.homeworks.length;
  // 只读模式：隐藏编辑入口
  ['btnAdd','btnShare','btnOpen','btnSave'].forEach(id => $(id).style.display='none');
  setFileStatus('分享快照（只读）', false, false);
  $('btnSave').disabled = true;
}

function exitSharedMode(){
  sharedMode = false;
  $('sharedBanner').style.display = 'none';
  ['btnAdd','btnShare','btnOpen','btnSave'].forEach(id => $(id).style.display='');
  // 清掉 hash，避免刷新又进只读
  history.replaceState(null,'', location.pathname + location.search);
}

async function genShareLink(){
  if(!DB.homeworks.length){ toast('没有作业可分享','err'); return; }
  const url = buildShareLink();
  // 先把 URL 更新上，方便用户手动从地址栏复制
  history.replaceState(null,'', url);
  let copied = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(url); copied = true; }catch(e){ copied = false; }
  }
  const n = DB.homeworks.length;
  const kb = Math.max(1, Math.round(url.length/1024));
  toast(copied
    ? `🔗 分享链接已复制到剪贴板（${n} 条 / ≈${kb}KB），粘贴发给同学即可`
    : `🔗 链接已写入地址栏（${n} 条 / ≈${kb}KB），请手动复制地址栏`,
    copied ? 'ok' : '');
}

function importToMine(){
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  exitSharedMode();
  setFileStatus('本地缓存（未连接文件）', false, false);
  if(DB.homeworks.length>0) $('btnSave').disabled = false;
  render();
  toast('📥 已导入到你的库，现在可自由编辑','ok');
}

/* ============ 事件绑定 ============ */
$('btnOpen').onclick = openFile;
$('btnSave').onclick = saveFile;
$('btnAdd').onclick = () => openModal();
$('btnCancel').onclick = closeModal;
$('btnSaveHw').onclick = saveHomework;
$('btnExport').onclick = exportMarkdown;
$('btnShare').onclick = genShareLink;
$('btnImport').onclick = importToMine;
$('search').oninput = render;
$('fSubject').onchange = render;
$('fTag').onchange = render;
$('fSort').onchange = render;
$('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeModal();
  if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); saveFile(); }
  if((e.ctrlKey||e.metaKey) && e.key==='n' && !$('overlay').classList.contains('show')){ e.preventDefault(); openModal(); }
});
$('hintClose').onclick = ()=> $('hint').style.display='none';

/* ============ 初始化 ============ */
(function init(){
  // 1) 优先看 URL hash 是否携带分享数据
  if(loadFromHash()){
    enterSharedMode();
  } else {
    // 2) 否则从 localStorage 恢复（浏览器刷新/重开兜底）
    const saved = localStorage.getItem(LS_KEY);
    if(saved){
      try{
        DB = JSON.parse(saved);
        if(!Array.isArray(DB.homeworks)) DB={homeworks:[]};
        setFileStatus('本地缓存（未连接文件）', false, false);
      }catch(e){ DB={homeworks:[]}; }
    } else {
      setFileStatus('未连接文件', false, false);
    }
    if(DB.homeworks.length>0 && !fileHandle){
      $('btnSave').disabled = false;
    }
  }
  render();
})();
</script>
